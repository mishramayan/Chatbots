[project]
name = "langchain-updated"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mishramayan", email = "mayan.mishra8@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "arxiv>=4.0.1",
    "beautifulsoup4>=4.15.0",
    "bs4>=0.0.2",
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "ipykernel>=7.3.0",
    "langchain>=1.3.18",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.1",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "langserve>=0.3.3",
    "pymupdf>=1.28.2",
    "pypdf>=6.16.2",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.1",
    "sse-starlette>=3.4.8",
    "streamlit>=1.63.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
langchain-updated = "langchain_updated:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
